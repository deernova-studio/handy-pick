name: 发布 macOS 版本

on:
  workflow_dispatch:
    inputs:
      version:
        description: '新版本号，例如 0.4.16（不要填 v）'
        type: string
        required: true
        default: '0.4.16'
      build_number:
        description: '新构建号，例如 38'
        type: string
        required: true
        default: '38'
      notes:
        description: '本次功能更新或问题修复（可选）'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

env:
  QUICK_SNAP_VERSION: ${{ inputs.version }}
  QUICK_SNAP_BUILD_NUMBER: ${{ inputs.build_number }}
  QUICK_SNAP_RELEASE_NOTES: ${{ inputs.notes }}

jobs:
  prepare:
    name: 校验版本与发布授权
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 检查分支、仓库与版本冲突
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 apps/handy-pick/Scripts/github_release.py preflight
      - name: 检查共享凭据授权配置
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
        run: |
          if [[ -z "$INFISICAL_IDENTITY_ID" || -z "$INFISICAL_PROJECT_SLUG" ]]; then
            echo '::error::请按 docs/github-actions.md 配置 Infisical OIDC 授权和两个仓库 Variables。'
            exit 1
          fi

  build:
    name: Apple Silicon 打包、签名与公证
    needs: prepare
    permissions:
      contents: read
      id-token: write
    runs-on: macos-15
    timeout-minutes: 75
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: 安装固定版本 One CLI 与任务工具
        run: |
          bash scripts/bootstrap-one.sh
          echo "$GITHUB_WORKSPACE/.cache/one/bin" >> "$GITHUB_PATH"
          .cache/one/bin/one mise trust
          .cache/one/bin/one mise install
      - name: 检查 One 任务配置是否同步
        run: one init mise --dry-run -o json | python3 -c 'import json,sys; p=json.load(sys.stdin); sys.exit("Run one init mise and commit mise.toml" if p["changes"] else 0)'
      - name: 测试与编译
        run: one run handy-pick:check --ui stream
      - name: 从 One 的共享凭据库获取签名材料
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          oidc-audience: one-macos-signing
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          domain: ${{ vars.INFISICAL_SITE_URL || 'https://app.infisical.com' }}
          env-slug: prod
          secret-path: /apple/macos
          include-imports: 'false'
          recursive: 'false'
          export-type: env
      - name: 临时钥匙串签名、公证与清理
        run: one run handy-pick:release:ci --ui stream
      - name: 保存已公证的安装包
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/handy-pick/build/releases/HandyPick-${{ inputs.version }}-build${{ inputs.build_number }}/*.dmg
            apps/handy-pick/build/releases/HandyPick-${{ inputs.version }}-build${{ inputs.build_number }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布到私有仓库 Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: build/github-release
      - name: 校验文件并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 apps/handy-pick/Scripts/github_release.py publish build/github-release
