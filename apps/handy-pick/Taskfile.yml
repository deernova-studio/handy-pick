version: '3'

tasks:
  dev:
    desc: Build and run HandyPick / 构建并运行 HandyPick
    cmds:
      - bash Scripts/dev.sh {{.CLI_ARGS}}
  build:
    desc: Build the development app / 构建开发应用
    cmds:
      - zsh Scripts/build.sh
  check:
    desc: Build smoke check / 构建与打包冒烟检查
    cmds:
      - bash Scripts/check-ci.sh
  smoke:
    desc: Run build smoke; see docs for manual cases / 构建冒烟，人工用例见文档
    cmds:
      - bash Scripts/check-ci.sh
  pack:
    desc: Build a local unsigned DMG / 构建本地未公证 DMG
    cmds:
      - bash Scripts/package.sh --dev
      - bash Scripts/pack.sh
  sign:
    desc: Build a Developer ID release candidate / 构建 Developer ID 发布候选
    cmds:
      - bash ../../scripts/signing.sh sign
  notarize:
    desc: Notarize the release candidate and DMG / 公证发布候选与 DMG
    cmds:
      - bash ../../scripts/signing.sh notarize
  release:
    desc: Sign and notarize without publishing / 签名并公证，不上传发布
    cmds:
      - bash ../../scripts/signing.sh release
  signing-check:
    desc: Verify One shared signing credentials / 验证 One 共享签名凭据
    cmds:
      - bash ../../scripts/signing.sh verify
  signing-setup:
    desc: Import credentials into One once / 一次性导入 One 共享签名凭据
    interactive: true
    cmds:
      - python3 ../../scripts/setup_signing.py
  release:ci:
    desc: Release using CI-injected shared credentials / 使用 CI 注入的共享凭据发布
    cmds:
      - python3 ../../scripts/macos_signing.py -- bash Scripts/release.sh
