min_version = '2026.9.7'
monorepo_root = true

[monorepo]
config_roots = []
lockfile = false

[tasks]
[tasks.build]
depends = ['//:handy-pick:build']

[tasks.check]
depends = ['//:handy-pick:check']

[tasks.dev]
depends = ['//:handy-pick:dev']




[tools]
task = '3.51.1'

[tasks.'handy-pick:build']
description = 'Build the development app / 构建开发应用'

dir = 'apps/handy-pick'

raw_args = true

run = 'task build --'

[tasks.'handy-pick:check']
description = 'Build smoke check / 构建与打包冒烟检查'

dir = 'apps/handy-pick'

raw_args = true

run = 'task check --'

[tasks.'handy-pick:dev']
description = 'Build and run HandyPick / 构建并运行 HandyPick'

dir = 'apps/handy-pick'

raw_args = true

run = 'task dev --'

[tasks.'handy-pick:notarize']
description = 'Notarize the release candidate and DMG / 公证发布候选与 DMG'

dir = 'apps/handy-pick'

raw_args = true

run = 'task notarize --'

[tasks.'handy-pick:pack']
description = 'Build a local unsigned DMG / 构建本地未公证 DMG'

dir = 'apps/handy-pick'

raw_args = true

run = 'task pack --'

[tasks.'handy-pick:release']
description = 'Sign and notarize without publishing / 签名并公证，不上传发布'

dir = 'apps/handy-pick'

raw_args = true

run = 'task release --'

[tasks.'handy-pick:release:ci']
description = 'Release using CI-injected shared credentials / 使用 CI 注入的共享凭据发布'

dir = 'apps/handy-pick'

raw_args = true

run = 'task release:ci --'

[tasks.'handy-pick:sign']
description = 'Build a Developer ID release candidate / 构建 Developer ID 发布候选'

dir = 'apps/handy-pick'

raw_args = true

run = 'task sign --'

[tasks.'handy-pick:signing-check']
description = 'Verify One shared signing credentials / 验证 One 共享签名凭据'

dir = 'apps/handy-pick'

raw_args = true

run = 'task signing-check --'

[tasks.'handy-pick:signing-setup']
interactive = true
description = 'Import credentials into One once / 一次性导入 One 共享签名凭据'

dir = 'apps/handy-pick'

raw_args = true

run = 'task signing-setup --'












[tasks.'handy-pick:smoke']
description = 'Run build smoke; see docs for manual cases / 构建冒烟，人工用例见文档'

dir = 'apps/handy-pick'

raw_args = true

run = 'task smoke --'

