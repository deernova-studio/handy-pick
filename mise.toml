min_version = '2026.9.7'
monorepo_root = true

[monorepo]
config_roots = []
lockfile = false

[tasks]
[tasks.build]
depends = ['//:quick-snap:build']

[tasks.check]
depends = ['//:quick-snap:check']

[tasks.dev]
depends = ['//:quick-snap:dev']

[tasks.'quick-snap:build']
description = 'Build the development app / 构建开发应用'
dir = 'apps/quick-snap'
raw_args = true
run = 'task build --'

[tasks.'quick-snap:check']
description = 'Check scripts, test and compile / 检查脚本、测试并编译'
dir = 'apps/quick-snap'
raw_args = true
run = 'task check --'

[tasks.'quick-snap:dev']
description = 'Build and run Quick Snap / 构建并运行 Quick Snap'
dir = 'apps/quick-snap'
raw_args = true
run = 'task dev --'

[tasks.'quick-snap:notarize']
description = 'Notarize the release candidate and DMG / 公证发布候选与 DMG'
dir = 'apps/quick-snap'
raw_args = true
run = 'task notarize --'

[tasks.'quick-snap:pack']
description = 'Build a local unsigned DMG / 构建本地未公证 DMG'
dir = 'apps/quick-snap'
raw_args = true
run = 'task pack --'

[tasks.'quick-snap:release']
description = 'Sign and notarize without publishing / 签名并公证，不上传发布'
dir = 'apps/quick-snap'
raw_args = true
run = 'task release --'

[tasks.'quick-snap:sign']
description = 'Build a Developer ID release candidate / 构建 Developer ID 发布候选'
dir = 'apps/quick-snap'
raw_args = true
run = 'task sign --'

[tasks.'quick-snap:test']
description = 'Run Swift and release-script tests / 运行 Swift 与发布脚本测试'
dir = 'apps/quick-snap'
raw_args = true
run = 'task test --'

[tasks.test]
depends = ['//:quick-snap:test']

[tools]
task = '3.51.1'



[tasks.'quick-snap:release:ci']
description = 'Release using CI-injected shared credentials / 使用 CI 注入的共享凭据发布'

dir = 'apps/quick-snap'

raw_args = true

run = 'task release:ci --'

[tasks.'quick-snap:signing-check']
description = 'Verify One shared signing credentials / 验证 One 共享签名凭据'

dir = 'apps/quick-snap'

raw_args = true

run = 'task signing-check --'



[tasks.'quick-snap:signing-setup']
interactive = true
description = 'Import credentials into One once / 一次性导入 One 共享签名凭据'

dir = 'apps/quick-snap'

raw_args = true

run = 'task signing-setup --'

